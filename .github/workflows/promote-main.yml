name: Promote Main

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: promote-main
  cancel-in-progress: false

jobs:
  promote:
    name: promote-main
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout approved commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Fetch branches and tags
        run: git fetch --force --tags origin main develop

      - name: Promote develop to main and create tag
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          if [ "${HEAD_BRANCH}" != "develop" ]; then
            echo "Workflow origin branch must be develop."
            exit 1
          fi

          if ! git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
            echo "Remote branch main does not exist."
            exit 1
          fi

          existing_tag="$(git tag --points-at "${HEAD_SHA}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          current_main_sha="$(git rev-parse origin/main)"
          push_mode="fast-forward"

          if [ "${current_main_sha}" = "${HEAD_SHA}" ] && [ -n "${existing_tag}" ]; then
            echo "Commit already promoted to main with tag ${existing_tag}."
            exit 0
          fi

          if ! git merge-base --is-ancestor origin/main "${HEAD_SHA}"; then
            if ! git rev-parse origin/main^ >/dev/null 2>&1; then
              echo "main diverged from develop. Automatic promotion requires fast-forward history."
              exit 1
            fi

            bootstrap_parent_sha="$(git rev-parse origin/main^)"
            bootstrap_changed_files="$(git diff --name-only "${bootstrap_parent_sha}" origin/main)"
            bootstrap_file=".github/workflows/promote-main.yml"

            if [ "${bootstrap_changed_files}" != "${bootstrap_file}" ]; then
              echo "main diverged from develop with non-bootstrap changes. Manual reconciliation required."
              exit 1
            fi

            if ! git merge-base --is-ancestor "${bootstrap_parent_sha}" "${HEAD_SHA}"; then
              echo "main diverged from develop before the bootstrap commit. Manual reconciliation required."
              exit 1
            fi

            if ! git cat-file -e "${HEAD_SHA}:${bootstrap_file}" 2>/dev/null; then
              echo "Approved develop commit does not contain ${bootstrap_file}."
              exit 1
            fi

            if ! diff -u <(git show "origin/main:${bootstrap_file}") <(git show "${HEAD_SHA}:${bootstrap_file}") >/dev/null; then
              echo "Bootstrap workflow content differs between main and develop. Manual reconciliation required."
              exit 1
            fi

            push_mode="bootstrap-force"
            echo "Detected bootstrap-only divergence on main. Proceeding with force-with-lease."
          fi

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n1)"

          if [ -z "${latest_tag}" ]; then
            next_tag="v0.1.0"
          else
            version="${latest_tag#v}"
            major="${version%%.*}"
            remainder="${version#*.}"
            minor="${remainder%%.*}"
            patch="${version##*.}"
            next_tag="v${major}.${minor}.$((patch + 1))"
          fi

          if git rev-parse "${next_tag}" >/dev/null 2>&1; then
            echo "Tag ${next_tag} already exists."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${push_mode}" = "bootstrap-force" ]; then
            git push --force-with-lease=refs/heads/main:${current_main_sha} origin "${HEAD_SHA}:refs/heads/main"
          else
            git push origin "${HEAD_SHA}:refs/heads/main"
          fi
          git tag -a "${next_tag}" "${HEAD_SHA}" -m "release: ${next_tag}"
          git push origin "${next_tag}"

          echo "Promoted ${HEAD_SHA} to main and created ${next_tag}."
