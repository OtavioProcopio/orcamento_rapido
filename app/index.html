<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D2366" />

    <title>Orça Rápido — Orçamentos profissionais para MEIs e autônomos</title>
    <meta
      name="description"
      content="Crie, imprima e acompanhe orçamentos profissionais em minutos. Grátis, sem cadastro complicado e com seus dados guardados só no seu navegador."
    />
    <link rel="canonical" href="https://otavioprocopio.github.io/orcamento_rapido/" />

    <!--
      Open Graph e Twitter Card ficam estáticos, só para a rota "/": os
      crawlers de prévia de link (WhatsApp, Twitter, Facebook, LinkedIn) não
      rodam JavaScript, então precisam achar o conteúdo já pronto aqui. O
      título/descrição por rota (dinâmico) fica a cargo de
      src/hooks/usePageMetadata.ts, que também sobrescreve o <link
      rel="canonical"> acima para cada rota — só o valor de pré-render fica
      fixo em "/".
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Orça Rápido" />
    <meta property="og:locale" content="pt_BR" />
    <meta
      property="og:title"
      content="Orça Rápido — Orçamentos profissionais para MEIs e autônomos"
    />
    <meta
      property="og:description"
      content="Crie, imprima e acompanhe orçamentos profissionais em minutos. Grátis, sem cadastro complicado e com seus dados guardados só no seu navegador."
    />
    <meta property="og:url" content="https://otavioprocopio.github.io/orcamento_rapido/" />
    <meta
      property="og:image"
      content="https://otavioprocopio.github.io/orcamento_rapido/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Orça Rápido — Orçamentos profissionais para MEIs e autônomos"
    />
    <meta
      name="twitter:description"
      content="Crie, imprima e acompanhe orçamentos profissionais em minutos. Grátis, sem cadastro complicado e com seus dados guardados só no seu navegador."
    />
    <meta
      name="twitter:image"
      content="https://otavioprocopio.github.io/orcamento_rapido/og-image.png"
    />
    <!--
      App 100% client-side, sem chamadas a APIs externas: default-src 'self'
      cobre o essencial. style-src precisa de 'unsafe-inline' pelos poucos
      `style={{ fontFamily }}` inline da LandingPage. img-src precisa de
      data: pra logo (upload vira base64) e pro conteúdo já embutido como
      data URI. A janela de impressão (utils/printBudget.ts) é escrita via
      document.write num popup same-origin e herda esta política — segue
      funcionando porque style-src já libera inline. gc.zgo.at (script) e
      otavioprocopio.goatcounter.com (beacon) são só pro contador de
      visitas anônimo — nenhum dado de orçamento/cliente passa por ali,
      só isso justifica abrir uma exceção no default-src 'self'.

      no_onload desliga a contagem automática do count.js: como o app é
      uma SPA (troca de rota não recarrega a página), a contagem
      automática só veria o hit inicial e ignoraria toda navegação
      seguinte. src/utils/analytics.ts chama window.goatcounter.count()
      manualmente a cada troca de rota (via useLocation em App.tsx) e em
      eventos-chave, cobrindo inclusive o carregamento inicial.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://otavioprocopio.goatcounter.com; font-src 'self'; connect-src 'self' https://otavioprocopio.goatcounter.com; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      data-goatcounter="https://otavioprocopio.goatcounter.com/count"
      data-goatcounter-settings='{"no_onload": true}'
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </body>
</html>
