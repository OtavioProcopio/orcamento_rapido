<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      App 100% client-side, sem chamadas a APIs externas: default-src 'self'
      cobre o essencial. style-src precisa de 'unsafe-inline' pelos poucos
      `style={{ fontFamily }}` inline da LandingPage. img-src precisa de
      data: pra logo (upload vira base64) e pro conteúdo já embutido como
      data URI. A janela de impressão (utils/printBudget.ts) é escrita via
      document.write num popup same-origin e herda esta política — segue
      funcionando porque style-src já libera inline. gc.zgo.at (script) e
      otavioprocopio.goatcounter.com (beacon) são só pro contador de
      visitas anônimo — nenhum dado de orçamento/cliente passa por ali,
      só isso justifica abrir uma exceção no default-src 'self'.

      no_onload desliga a contagem automática do count.js: como o app é
      uma SPA (troca de rota não recarrega a página), a contagem
      automática só veria o hit inicial e ignoraria toda navegação
      seguinte. src/utils/analytics.ts chama window.goatcounter.count()
      manualmente a cada troca de rota (via useLocation em App.tsx) e em
      eventos-chave, cobrindo inclusive o carregamento inicial.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://otavioprocopio.goatcounter.com; font-src 'self'; connect-src 'self' https://otavioprocopio.goatcounter.com; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <title>Orca Rapido</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      data-goatcounter="https://otavioprocopio.goatcounter.com/count"
      data-goatcounter-settings='{"no_onload": true}'
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </body>
</html>
