<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      App 100% client-side, sem chamadas a APIs externas: default-src 'self'
      cobre o essencial. style-src precisa de 'unsafe-inline' pelos poucos
      `style={{ fontFamily }}` inline da LandingPage. img-src precisa de
      data: pra logo (upload vira base64) e pro conteúdo já embutido como
      data URI. A janela de impressão (utils/printBudget.ts) é escrita via
      document.write num popup same-origin e herda esta política — segue
      funcionando porque style-src já libera inline.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <title>Orca Rapido</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
